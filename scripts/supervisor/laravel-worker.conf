; Supervisor config example for Laravel queue workers
; Path/location varies by host. Some cPanel plans do not support Supervisor.
;
; Replace USERNAME and APP_ROOT.

[program:client-portal-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/USERNAME/apps/client-portal/current/artisan queue:work --sleep=1 --tries=3 --timeout=120
autostart=true
autorestart=true
user=USERNAME
numprocs=1
redirect_stderr=true
stdout_logfile=/home/USERNAME/apps/client-portal/shared/storage/logs/worker.log
stopwaitsecs=120

