<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3c8dbc" />
    <title>Offline · Client Portal</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, sans-serif; margin: 0; background: #f4f6f9; color: #111827; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
      .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      .title { font-size: 20px; margin: 0 0 8px; }
      .muted { color: #6b7280; margin: 0 0 16px; }
      .btn { display: inline-block; padding: 12px 14px; border-radius: 10px; background: #3c8dbc; color: white; text-decoration: none; font-weight: 600; }
      .hint { margin-top: 14px; font-size: 14px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1 class="title">You’re offline</h1>
        <p class="muted">Some features need an internet connection. When you’re back online, this will work normally.</p>
        <a class="btn" href="/dashboard">Try again</a>
        <div class="hint">Tip: If you were filling a form, keep this tab open—your browser may resync when online.</div>
      </div>
    </div>
  </body>
</html>
