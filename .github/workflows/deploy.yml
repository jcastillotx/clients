name: Deploy readiness (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment label"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:run

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Deploy instructions
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo ""
          echo "This application deploys as a standalone Docker container on OpenShip (see docs/OPENSHIP-MIGRATION.md)."
          echo "Build Linux amd64 off-host, verify the private candidate, then promote it with a retained rollback container."
          echo ""
          echo "Before promoting:"
          echo "  1. Confirm Supabase migrations are applied"
          echo "  2. Confirm RLS policies from scripts/rls-policies.sql"
          echo "  3. Confirm Stripe/Inngest/Resend webhooks point to production URL"
